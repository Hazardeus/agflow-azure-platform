#cloud-config
# ADR-0006: infrastructure-readiness bootstrap only — no application containers, no secrets.

write_files:
  - path: /opt/agflow/bootstrap-data-disk.sh
    permissions: '0750'
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      DEVICE="/dev/disk/azure/scsi1/lun0"
      MOUNT_POINT="/srv/agflow"

      # Wait for the Azure data disk (fixed LUN 0) to be enumerated by the OS.
      for _ in $(seq 1 30); do
        [ -e "${DEVICE}" ] && break
        sleep 2
      done

      if [ ! -e "${DEVICE}" ]; then
        echo "agflow-bootstrap: data disk ${DEVICE} did not appear, aborting disk setup" >&2
        exit 1
      fi

      mkdir -p "${MOUNT_POINT}"

      # Only format a disk with no existing filesystem signature; never reformat existing data.
      if ! blkid "${DEVICE}" >/dev/null 2>&1; then
        mkfs.ext4 -L agflow-data "${DEVICE}"
      fi

      DISK_UUID=$(blkid -s UUID -o value "${DEVICE}")

      if ! grep -q "${DISK_UUID}" /etc/fstab; then
        echo "UUID=${DISK_UUID} ${MOUNT_POINT} ext4 defaults,nofail 0 2" >> /etc/fstab
      fi

      mount -a

  - path: /opt/agflow/bootstrap-docker.sh
    permissions: '0750'
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      # Ubuntu 24.04 distribution-signed packages — no upstream Docker apt repository, no curl-pipe-shell.
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io docker-compose-v2 uidmap
      systemctl enable --now docker

runcmd:
  - [ bash, /opt/agflow/bootstrap-data-disk.sh ]
  - [ bash, /opt/agflow/bootstrap-docker.sh ]
